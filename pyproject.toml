[tool.poetry]
name = "customertrafficcv"
version = "0.1.0"
description = ""
authors = ["WhiteZHood <littlezwhitezridingzhood@gmail.com>"]
license = "MIT license"
readme = "README.md"
packages = [
    { include = "app", from = "src" },
    { include = "main", from = "src" },
    { include = "services", from = "src" },
    { include = "utils", from = "src" }
]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
ipykernel = ">=6.29.5,<7.0.0"
opencv-python = ">=4.8.1.78,<=4.10.0.84"
ffmpeg-python = "0.2.0"
streamlit = ">=1.44.0,<2.0.0"
requests = ">=2.32.3,<3.0.0"
ultralytics = ">=8.3.102,<8.3.103"
imutils = ">=0.5.4,<0.6.0"
deep-sort-realtime = ">=1.3.2,<2.0.0"
cvzone = ">=1.6.1,<2.0.0"
psycopg2 = ">=2.9.10,<3.0.0"
fastapi = "*"
flet = "*"
uvicorn = "*"
psycopg2-binary = "*"
opencv-python-headless = "4.10.0.84"
shapely = ">=2.0.0"
lap = ">=0.5.12"
pycocotools = "^2.0.8"
sqlalchemy = "^2.0.41"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
